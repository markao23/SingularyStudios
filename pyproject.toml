[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "singularystudios-bot"
version = "0.1.0"
description = "Bot Discord modular construído com discord.py."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "aiohttp>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
singularystudios-bot = "bot.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
